name: Build style manifests

on:
  push:
    branches: [main]
    paths:
      - 'skybox/styles/**'
      - 'weapons/styles/**'
      - 'autopeek/styles/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-manifests.yml'
  pull_request:
    paths:
      - 'skybox/styles/**'
      - 'weapons/styles/**'
      - 'autopeek/styles/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-manifests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_manifests.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Regenerate and commit catalogs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            python -m unittest discover -s tests -v
            python scripts/build_manifests.py
            git add -- skybox/manifest.json weapons/manifest.json autopeek/manifest.json
            if git diff --cached --quiet; then
              echo 'Manifests are already up to date.'
              exit 0
            fi
            git commit -m 'Update generated style manifests'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish manifests after three attempts.' >&2
          exit 1
